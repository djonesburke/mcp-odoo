[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-mcp"
version = "1.3.0+burke.18"
description = "Odoo MCP for AI agents — 41 tools, gated writes, multi-instance. Free hosted product: ERPipe (mcp.erpipe.com)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["odoo", "mcp", "server", "model-context-protocol", "chatgpt", "claude", "erpipe"]
authors = [
    {name = "Lê Anh Tuấn", email = "justin.le.1105@gmail.com"}
]
dependencies = [
    "mcp>=2,<3",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://erpipe-org.github.io/mcp-odoo/"
Source = "https://github.com/erpipe-org/mcp-odoo"
Documentation = "https://github.com/erpipe-org/mcp-odoo#readme"
Changelog = "https://github.com/erpipe-org/mcp-odoo/blob/main/CHANGELOG.md"
Issues = "https://github.com/erpipe-org/mcp-odoo/issues"
Security = "https://github.com/erpipe-org/mcp-odoo/security"
"Hosted (ERPipe)" = "https://mcp.erpipe.com/"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest>=7",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
odoo-mcp = "odoo_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["odoo_mcp"]

[tool.setuptools.package-data]
odoo_mcp = ["data/*.json"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
# Seven test modules share fakes via `from tests.test_batch_write import FakeCtx`,
# which needs the REPO ROOT on sys.path. `python -m pytest` run from the root (what
# CI does) supplies that by accident, because `-m` prepends the working directory;
# the `pytest` console script and `pytest <path>` run from any other directory do
# not, and the suite then dies with 7 collection errors and ZERO tests run while
# still looking like a plain import failure. Pinning it here is what makes a local
# run mean the same thing as a CI run, whichever form is used.
# `pythonpath` is core pytest >= 7 (floored in the dev extra above), not a plugin.
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# The quality gate is `mypy src` (CONTRIBUTING.md); `files` makes a bare `mypy`
# mean exactly that instead of erroring out with "no files or modules specified".
files = ["src"]
# examples/ is excluded from discovery, not overlooked. Two standalone snippets
# there (examples/langgraph/odoo_agent.py and examples/openai-agents/odoo_agent.py)
# both map to the module basename `odoo_agent` in flat non-package directories, so
# any recursive run stops at discovery with "Duplicate module named" before it
# checks anything. They also import langchain/crewai/openai-agents, which are not
# dependencies of this package, so they were never part of the typed surface.
# Note the pattern is matched against paths relative to the CURRENT DIRECTORY,
# so it holds for a run from the repo root -- which is what CONTRIBUTING.md
# documents. Invoked from elsewhere with an absolute path, examples/ is
# rediscovered and the duplicate returns.
exclude = ["^examples/"]

# Tool modules annotate protocol-level response models (typed MCP outputSchema)
# while the functions keep returning the plain-dict envelope MCPServer validates
# at the MCP layer; the runtime dict/model mismatch is deliberate.
[[tool.mypy.overrides]]
module = [
    "odoo_mcp.tools_read",
    "odoo_mcp.tools_diagnostics",
    "odoo_mcp.tools_accounting",
    "odoo_mcp.tools_async",
    "odoo_mcp.tools_cross_instance",
    "odoo_mcp.tools_knowledge",
]
disable_error_code = ["return-value"]
